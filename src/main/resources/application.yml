spring:
  application:
    name: fmhy-clone
  datasource:
    url: jdbc:mysql://localhost:3306/fmhy_clone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: fmhy_app
    password: password.com1
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
app:
  jwt:
    secret: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS
    expiration-ms: 3600000

logging:
  level:
    root: INFO
    com.fmhyclone: DEBUG
  file:
    name: logs/fmhy-clone.log